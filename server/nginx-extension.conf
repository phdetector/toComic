# toComic 269278.xyz panel-nginx extension (deployed by deploy.ps1 -DeployNginx)
# Installed at /www/server/panel/vhost/nginx/extension/269278.xyz/security.conf
# and auto-included by the panel vhost (include .../extension/269278.xyz/*.conf;).

client_max_body_size 64k;
ssl_stapling on;
ssl_stapling_verify on;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;

# Self-hosted update APK (still published to the systemd nginx static dir)
location = /ExpoPlanner.apk {
    root /usr/share/nginx/html;
    try_files $uri =404;
}

# Expo Planner API -> node on 127.0.0.1:7978
location /api/ {
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:7978;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
}
