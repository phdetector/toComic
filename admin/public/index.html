<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>toComic 建议管理</title>
<style>
:root{--bg:#f5f4ee;--ink:#141413;--surface:#ffffff;--border:#e3e0d8;--accent:#da7756;--blue:#66ccff;--muted:#7a766c;}
@media (prefers-color-scheme:dark){:root{--bg:#262624;--ink:#f5f4ee;--surface:#2f2e2c;--border:#46443f;--muted:#b6b0a4;}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"Segoe UI","Noto Sans SC",sans-serif;min-height:100vh}
header{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg)}
header h1{font-size:17px;font-weight:700}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent}
.btn.on{background:var(--blue);border-color:var(--blue);color:#00324d}
.btn.wide{width:100%}
.layout{display:grid;grid-template-columns:3fr 1fr;gap:16px;padding:16px 18px;max-width:1200px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:12px}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card h2{font-size:15px;font-weight:700}
.card .time{color:var(--muted);font-size:12px}
.card p{white-space:pre-wrap;margin:8px 0}
.card textarea{width:100%;min-height:64px;border:1px solid var(--border);border-radius:8px;padding:8px;font:inherit;background:var(--bg);color:var(--ink)}
.card .actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.sidebar .card h2{font-size:14px;margin-bottom:8px}
.filter{display:flex;flex-direction:column;gap:6px}
.viewhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.viewhead h2{font-size:16px;font-weight:700}
.hidden{display:none}
#more{padding:8px 0}
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center}
#login form{width:min(360px,90vw);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:10px}
#login h1{font-size:18px}
#login input{border:1px solid var(--border);border-radius:8px;padding:10px;font:inherit;background:var(--bg);color:var(--ink)}
#login .error{color:#c65a52;font-size:13px}
@media(max-width:760px){.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>toComic 建议管理</h1>
  <span id="stats" style="margin-left:auto;color:var(--muted);font-size:13px"></span>
  <span id="ver" style="color:var(--muted);font-size:12px"></span>
  <button class="btn ghost" id="logout" style="margin-left:8px">退出</button>
</header>

<div class="layout hidden" id="main">
  <section id="listwrap">
    <div class="viewhead hidden" id="archive-head">
      <button class="btn" id="archive-back">返回</button>
      <h2>已归档</h2>
    </div>
    <div id="list"></div>
    <div id="more" class="hidden"><button class="btn wide" id="load-more">加载更多</button></div>
  </section>
  <aside class="sidebar">
    <div class="card" id="filter-card">
      <h2>筛选</h2>
      <div class="filter">
        <button class="btn on" data-filter="all">全部</button>
        <button class="btn" data-filter="pending">未处理</button>
        <button class="btn" data-filter="done">已处理</button>
      </div>
    </div>
    <div class="card">
      <h2>收藏</h2>
      <button class="btn wide" id="favorites">查看收藏</button>
    </div>
    <div class="card">
      <h2>归档</h2>
      <button class="btn wide" id="open-archive">查看归档</button>
    </div>
  </aside>
</div>

<div id="login">
  <form id="login-form">
    <h1>验证身份</h1>
    <div id="health" style="font-size:13px;color:var(--muted)">正在检测后端服务…</div>
    <input id="username" placeholder="用户名" autocomplete="username">
    <input id="password" type="password" placeholder="密码" autocomplete="current-password">
    <div class="error hidden" id="login-error">验证失败</div>
    <button class="btn primary" type="submit" id="login-btn">登录</button>
  </form>
</div>

<script>
const PAGE_SIZE = 50
const state = { filter: 'all', favorites: false, view: 'main', data: [], page: 1, hasMore: false, total: 0 }
const listEl = document.getElementById('list')
const loginEl = document.getElementById('login')
const mainEl = document.getElementById('main')
const statsEl = document.getElementById('stats')
const moreEl = document.getElementById('more')
const loadMoreEl = document.getElementById('load-more')
const archiveHeadEl = document.getElementById('archive-head')
const filterCardEl = document.getElementById('filter-card')
const verEl = document.getElementById('ver')
const healthEl = document.getElementById('health')
const loginBtn = document.getElementById('login-btn')
const UI_VERSION = 2

function fmt(ms) { if (!ms) return ''; const d = new Date(ms); const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}` }
function done(item) { return Boolean(item.reply) || Boolean(item.processed) }

function visibleItems() {
  let items = state.data.slice()
  if (state.view === 'archive') {
    items = items.filter(i => i.archived)
  } else if (state.favorites) {
    items = items.filter(i => i.favorite)
  } else {
    items = items.filter(i => !i.archived)
    if (state.filter === 'pending') items = items.filter(i => !done(i))
    else if (state.filter === 'done') items = items.filter(i => done(i))
  }
  items.sort((a, b) => { const ad = done(a), bd = done(b); if (ad !== bd) return ad ? 1 : -1; return (a.submittedAt || 0) - (b.submittedAt || 0) })
  return items
}

function render() {
  const items = visibleItems()
  const pending = state.data.filter(i => !done(i)).length
  const replied = state.data.filter(done).length
  const archived = state.data.filter(i => i.archived).length
  statsEl.textContent = `共 ${state.total} 条 / 未处理 ${pending} / 已处理 ${replied} / 已归档 ${archived}`
  archiveHeadEl.classList.toggle('hidden', state.view !== 'archive')
  filterCardEl.classList.toggle('hidden', state.view !== 'main')

  listEl.innerHTML = ''
  for (const item of items) {
    const card = document.createElement('div')
    card.className = 'card'
    card.dataset.id = item.id
    const status = item.archived ? '已归档' : (done(item) ? '已处理' : '未处理')
    card.innerHTML = `
      <div class="row"><h2>${escapeHtml(item.title)}</h2><span class="time">${fmt(item.submittedAt)} · ${status}</span></div>
      <p>${escapeHtml(item.content)}</p>
      <div class="row"><span class="time">版本 ${escapeHtml(item.appVersion || '-')} · ${escapeHtml(item.deviceModel || '-')}</span>
        <span class="time">${item.favorite ? '已收藏' : ''}</span></div>
      ${state.view === 'archive' ? `
      <div class="actions">
        <button class="btn" data-act="archive">取消归档</button>
      </div>` : `
      <textarea placeholder="输入回复">${escapeHtml(item.reply || '')}</textarea>
      <div class="actions">
        <button class="btn primary" data-act="reply">提交回复</button>
        <button class="btn ${item.favorite ? 'on' : ''}" data-act="favorite">${item.favorite ? '取消收藏' : '收藏'}</button>
        <button class="btn" data-act="archive">归档</button>
      </div>`}
    `
    listEl.appendChild(card)
  }
  moreEl.classList.toggle('hidden', !state.hasMore)
  if (items.length === 0) {
    const empty = document.createElement('div')
    empty.className = 'card'
    empty.textContent = state.view === 'archive' ? '暂无已归档建议' : '暂无建议'
    listEl.appendChild(empty)
  }
}

function escapeHtml(value) {
  return String(value || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
}

function showLogin() {
  mainEl.classList.add('hidden')
  loginEl.classList.remove('hidden')
  document.getElementById('login-error').classList.add('hidden')
}

function fetchWithTimeout(url, options = {}, ms = 10000) {
  const controller = new AbortController()
  const timer = setTimeout(() => controller.abort(), ms)
  return fetch(url, { ...options, signal: controller.signal }).finally(() => clearTimeout(timer))
}

async function api(route, method, body) {
  let response
  try {
    response = await fetchWithTimeout('/api/' + route, {
      method: method || 'GET',
      headers: { 'Content-Type': 'application/json', 'X-ToComic-Admin': '1' },
      body: body ? JSON.stringify(body) : undefined,
    })
  } catch (error) {
    if (error && error.name === 'AbortError') throw new Error('请求超时, 请检查本地管理端是否仍在运行')
    throw new Error('无法连接本地管理端: ' + String(error))
  }
  let payload = null
  try { payload = await response.json() } catch (_error) { payload = { ok: false } }
  if (response.status === 401 && route !== 'login') {
    showLogin()
    const error = new Error('登录已过期, 请重新登录')
    error.expired = true
    throw error
  }
  if (response.status === 403) throw new Error(payload.hint || '页面版本过旧, 请强制刷新(Ctrl+Shift+R)')
  if (!response.ok || !payload.ok) throw new Error(payload.error || 'request failed')
  return payload
}

// ---- v2 自检 ----
if (!window.fetch || typeof Promise === 'undefined' || !window.AbortController) {
  document.getElementById('login-error').classList.remove('hidden')
  document.getElementById('login-error').textContent = '请使用新版 Chrome/Edge/Firefox 打开本页面'
}

function showFatal(msg) {
  const err = document.getElementById('login-error')
  if (err) { err.classList.remove('hidden'); err.textContent = msg }
}
window.addEventListener('error', event => showFatal('页面脚本错误: ' + (event.message || 'unknown')))
window.addEventListener('unhandledrejection', event => {
  const reason = event.reason
  showFatal('请求异常: ' + (reason && reason.message ? reason.message : String(reason)))
})

verEl.textContent = 'v' + UI_VERSION
function checkHealth() {
  fetchWithTimeout('/api/ping', {}, 5000)
    .then(r => r.json().catch(() => ({})))
    .then(p => {
      healthEl.textContent = (p && p.remote === 'up') ? '后端服务：已连接 ✓' : '后端服务：已连接 ✓（远程隧道未连通）'
      healthEl.style.color = '#2f9e44'
    })
    .catch(() => {
      healthEl.textContent = '后端服务：连接失败 ✗ 请确认已启动 node admin/admin-server.js'
      healthEl.style.color = '#c65a52'
    })
}
checkHealth()

async function load() {
  state.page = 1
  const payload = await api(`suggestions?page=1&limit=${PAGE_SIZE}`)
  state.data = payload.suggestions || []
  state.total = payload.total || state.data.length
  state.hasMore = Boolean(payload.hasMore)
  render()
}

async function loadMore() {
  state.page += 1
  const payload = await api(`suggestions?page=${state.page}&limit=${PAGE_SIZE}`)
  const more = payload.suggestions || []
  state.data = state.data.concat(more)
  state.total = payload.total || state.total
  state.hasMore = Boolean(payload.hasMore)
  render()
}

document.getElementById('login-form').addEventListener('submit', async event => {
  event.preventDefault()
  const err = document.getElementById('login-error')
  err.classList.add('hidden')
  loginBtn.disabled = true
  const original = loginBtn.textContent
  loginBtn.textContent = '登录中…'
  try {
    await api('login', 'POST', {
      username: document.getElementById('username').value,
      password: document.getElementById('password').value,
    })
    loginEl.classList.add('hidden')
    mainEl.classList.remove('hidden')
    await load()
  } catch (error) {
    err.classList.remove('hidden')
    err.textContent = error.message
  } finally {
    loginBtn.disabled = false
    loginBtn.textContent = original
  }
})

document.getElementById('logout').addEventListener('click', () => location.reload())

loadMoreEl.addEventListener('click', () => { loadMore().catch(e => { if (!e.expired) window.alert(e.message) }) })

document.getElementById('open-archive').addEventListener('click', () => {
  state.view = 'archive'
  state.favorites = false
  render()
})

document.getElementById('archive-back').addEventListener('click', () => {
  state.view = 'main'
  render()
})

document.querySelectorAll('[data-filter]').forEach(button => {
  button.addEventListener('click', () => {
    document.querySelectorAll('[data-filter]').forEach(b => b.classList.remove('on'))
    button.classList.add('on')
    state.filter = button.dataset.filter
    state.favorites = false
    document.getElementById('favorites').classList.remove('on')
    render()
  })
})

document.getElementById('favorites').addEventListener('click', () => {
  state.favorites = !state.favorites
  document.getElementById('favorites').classList.toggle('on', state.favorites)
  if (state.favorites) {
    document.querySelectorAll('[data-filter]').forEach(b => b.classList.remove('on'))
    state.filter = 'all'
  }
  render()
})

listEl.addEventListener('click', async event => {
  const button = event.target.closest('button[data-act]')
  if (!button) return
  const card = button.closest('.card')
  const id = card.dataset.id
  const act = button.dataset.act
  try {
    if (act === 'reply') {
      const reply = card.querySelector('textarea').value
      await api('reply', 'POST', { id, reply })
    } else if (act === 'favorite') {
      const item = state.data.find(i => i.id === id)
      await api('favorite', 'POST', { id, favorite: !item.favorite })
    } else if (act === 'archive') {
      const item = state.data.find(i => i.id === id)
      await api('archive', 'POST', { id, archived: !item.archived })
    }
    await load()
  } catch (error) {
    if (!error.expired) window.alert(error.message)
  }
})
</script>
</body>
</html>
